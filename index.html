<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>HOME | Archive of Scone</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#222}body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:url("images/grid-tile.png");background-repeat:repeat;opacity:.4}body{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.home{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:0 24px 40px}.top-spacer{width:min(1180px,100%);height:78px;flex:0 0 78px}.top a{color:inherit;text-decoration:none}.top strong{color:#222;font-weight:600}.stage{width:min(1080px,100%);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0 54px}.art-frame{width:min(100%,960px);max-height:calc(100svh - 250px);overflow:hidden;border-radius:18px;background:transparent;display:flex;align-items:center;justify-content:center;mask-image:radial-gradient(ellipse at center,#000 38%,rgba(0,0,0,.85) 56%,rgba(0,0,0,.35) 82%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse at center,#000 38%,rgba(0,0,0,.85) 56%,rgba(0,0,0,.35) 82%,transparent 100%)}.art{display:block;width:100%;height:auto;max-height:calc(100svh - 250px);object-fit:contain;border-radius:16px;animation:appear 1.1s ease both}.actions{display:flex;gap:12px;margin-top:5px;animation:rise .8s .18s ease both}.button{min-width:148px;padding:15px 24px;text-align:center;border:1px solid #222;border-radius:8px;color:#222;text-decoration:none;font-size:11px;letter-spacing:.16em;transition:background .2s,color .2s,transform .2s}.button.primary{background:#222;color:#fff}.button:hover{background:#8c83dc;border-color:#8c83dc;color:#fff;transform:translateY(-2px)}.caption{margin-top:25px;font-family:Georgia,"Times New Roman",serif;font-size:11px;letter-spacing:.2em;color:#aaa}.bottom{font-size:9px;letter-spacing:.16em;color:#bbb}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.home{padding:0 18px 25px}.top-spacer{height:62px;flex-basis:62px}.stage{padding:20px 0 35px}.art{max-height:calc(100svh - 205px);width:115%;max-width:none}.actions{width:100%;gap:9px}.button{min-width:0;flex:1;padding:14px 10px}.caption{margin-top:20px}}
</style></head>
