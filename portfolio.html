<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>Portfolio | [YOUR NAME]</title>
<style>
:root{--paper:#ffffff;--ink:#242321;--muted:#817f79;--line:#e7e4dd;--accent:#6f63d9;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button{font:inherit;color:inherit}.wrap{max-width:1180px;margin:auto;padding:0 34px}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.13em}.brand{font-weight:700}.toplink{color:var(--muted);text-decoration:none;letter-spacing:0}.hero{padding:76px 0 58px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:700}.hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(48px,8vw,92px);letter-spacing:-.055em;line-height:.95;margin:17px 0 20px}.intro{font-size:14px;line-height:1.9;color:#6f6d68;margin:0;max-width:560px}.hero-side{padding-bottom:4px;text-align:right}.hero-side p{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 16px}.contact{display:inline-flex;padding:12px 17px;background:var(--ink);color:#fff;text-decoration:none;font-size:12px;border-radius:2px}.section-head{display:flex;justify-content:space-between;align-items:baseline;padding:27px 0 16px;border-top:1px solid var(--line)}.section-head h2{font-size:13px;letter-spacing:.12em;margin:0}.count{font-size:11px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 22px;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;color:#77736c;border-radius:99px;padding:8px 13px;font-size:11px;cursor:pointer;transition:.2s}.chip:hover,.chip.active{color:#fff;background:var(--ink);border-color:var(--ink)}.tools{display:flex;gap:8px}.text-btn{border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:8px 0 8px 12px}.text-btn:hover{color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 22px}.card{min-width:0}.thumb{width:100%;aspect-ratio:1/1;background:#fff;overflow:hidden;position:relative;cursor:zoom-in}.thumb img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1)}.card:hover .thumb img{transform:scale(1.035)}.card-info{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-top:12px}.card-title{font-size:12px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.mini-tag{font-size:10px;color:#8a877f}.edit{border:0;background:none;color:#aaa69d;font-size:10px;cursor:pointer;padding:2px 0 2px 8px;white-space:nowrap}.edit:hover{color:var(--accent)}.pagination{display:flex;justify-content:center;gap:7px;padding:42px 0 76px}.page-btn{width:34px;height:34px;border:1px solid var(--line);background:transparent;border-radius:50%;font-size:11px;cursor:pointer}.page-btn.active,.page-btn:hover{color:white;background:var(--ink);border-color:var(--ink)}.empty{padding:70px 0;text-align:center;color:var(--muted);font-size:13px}.footer{border-top:1px solid var(--line);padding:22px 0 32px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between}.modal{position:fixed;inset:0;z-index:10;background:rgba(18,17,20,.88);display:none;align-items:center;justify-content:center;padding:28px}.modal.open{display:flex}.modal img{max-width:min(92vw,1200px);max-height:88vh;object-fit:contain}.close{position:absolute;right:24px;top:18px;color:white;background:none;border:0;font-size:30px;cursor:pointer}.modal-caption{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#eee;font-size:12px}.dialog-backdrop{position:fixed;inset:0;background:#17161999;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.dialog-backdrop.open{display:flex}.dialog{width:min(440px,100%);padding:26px;background:var(--paper);box-shadow:0 20px 80px #0003}.dialog h3{margin:0 0 9px;font-size:18px}.dialog p{font-size:12px;line-height:1.7;color:var(--muted);margin:0 0 18px}.dialog input{width:100%;padding:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;outline:none}.dialog input:focus{border-color:var(--accent)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.dialog-actions button{padding:9px 14px;border:1px solid var(--line);background:transparent;font-size:12px;cursor:pointer}.dialog-actions .save{color:white;background:var(--ink);border-color:var(--ink)}.notice{font-size:10px;color:var(--muted);margin-top:15px;line-height:1.6}@media(max-width:700px){.wrap{padding:0 18px}.topbar{height:60px}.hero{padding:58px 0 42px;grid-template-columns:1fr;gap:22px}.hero-side{text-align:left}.hero-side p br{display:none}.grid{gap:22px 12px}.card-title{font-size:11px}.edit{font-size:9px}.thumb{background:#fff}.footer{gap:12px;flex-wrap:wrap}.toolbar{align-items:flex-start}.tools{margin-left:auto}}@media(max-width:420px){.grid{gap:18px 9px}.card-info{display:block}.edit{padding:7px 0}.thumb{aspect-ratio:1}}
</style></head>
<body><div class="wrap">
<header class="topbar"><a class="brand" href="index.html" style="color:inherit;text-decoration:none">HOME</a><a class="toplink" href="portfolio.html">Archive of SCONE</a></header>
<section class="hero"><div><div class="eyebrow">ILLUSTRATION PORTFOLIO · 2026</div><p class="intro">안녕하세요 일러스트레이터 SCONE입니다</p></div><div class="hero-side"><p>ILLUSTRATION · MV · CHARACTER<br>AVAILABLE FOR COLLABORATION</p><a class="contact" href="contact.html">CONTACT　↗</a></div></section>
<section id="works"><div class="section-head"><h2>SELECTED WORKS</h2><span class="count" id="count"></span></div><div class="toolbar"><div class="filters" id="filters"></div><div class="tools"><button class="text-btn" id="exportBtn">태그 내보내기 ↓</button><button class="text-btn" id="importBtn">태그 가져오기 ↑</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></div><div class="grid" id="grid"></div><div class="pagination" id="pagination"></div></section>
<footer class="footer"><span>© 2026 SCONE. ALL RIGHTS RESERVED.</span><span>ILLUSTRATION PORTFOLIO</span></footer>
</div><div class="modal" id="modal"><button class="close" aria-label="닫기">×</button><img alt="작품 크게 보기"><div class="modal-caption"></div></div>
<div class="dialog-backdrop" id="tagDialog"><div class="dialog"><h3>작품 태그 설정</h3><p id="dialogTitle"></p><input id="tagInput" placeholder="예: 커버곡, 앨범, 캐릭터 (쉼표로 구분)"><div class="dialog-actions"><button id="cancelTag">취소</button><button class="save" id="saveTag">저장</button></div><div class="notice">태그 변경은 이 브라우저에 저장됩니다. 다른 기기나 방문자에게도 적용하려면 태그를 내보낸 뒤 배포 파일에 반영해 주세요.</div></div></div>
<script>
const works=[
{name:'Design_01.jpg',tags:['디자인','캐릭터']},
{name:'LD_01.png',tags:['일러스트','캐릭터']},
{name:'LD_02.png',tags:['일러스트','캐릭터']},
{name:'LD_03.jpg',tags:['일러스트','캐릭터']},
{name:'LD_04.jpg',tags:['일러스트','캐릭터']},
{name:'LD_05.jpg',tags:['일러스트','캐릭터']},
{name:'LD_06.jpg',tags:['일러스트','캐릭터']},
{name:'LD_07.jpg',tags:['일러스트','캐릭터']},
{name:'LD_08.jpg',tags:['일러스트','캐릭터']},
{name:'LD_09.png',tags:['일러스트','캐릭터']},
{name:'MV_01.jpg',tags:['MV','영상']},
{name:'MV_02.jpg',tags:['MV','영상']},
{name:'MV_03.jpg',tags:['MV','영상']},
{name:'MV_04.jpg',tags:['MV','영상']},
{name:'SD_01.jpg',tags:['SD','굿즈']},
{name:'SD_02.jpg',tags:['SD','굿즈']}
].map((w,i)=>({...w,id:String(i),src:'images/'+w.name,title:w.name.replace(/\.[^.]+$/,'')}));
const key='illustration-portfolio-tags-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{};works.forEach(w=>{if(Array.isArray(saved[w.id]))w.tags=saved[w.id]});
let activeTag='전체',page=1,editing=null;const perPage=9;const grid=document.getElementById('grid'),filters=document.getElementById('filters'),pagination=document.getElementById('pagination');
function filtered(){return activeTag==='전체'?works:works.filter(w=>w.tags.includes(activeTag))}
function renderFilters(){const tags=[...new Set(works.flatMap(w=>w.tags))].sort((a,b)=>a.localeCompare(b,'ko'));filters.innerHTML='';['전체',...tags].forEach(t=>{const b=document.createElement('button');b.className='chip'+(activeTag===t?' active':'');b.textContent=t;b.onclick=()=>{activeTag=t;page=1;render()};filters.appendChild(b)})}
function render(){renderFilters();const list=filtered(),pages=Math.max(1,Math.ceil(list.length/perPage));page=Math.min(page,pages);document.getElementById('count').textContent=String(list.length).padStart(2,'0')+' WORKS';grid.innerHTML='';list.slice((page-1)*perPage,page*perPage).forEach(w=>{const card=document.createElement('article');card.className='card';const tags=w.tags.map(t=>`<span class="mini-tag">#${esc(t)}</span>`).join('');card.innerHTML=`<div class="thumb" role="button" tabindex="0" aria-label="${esc(w.title)} 크게 보기"><img src="${w.src}" alt="${esc(w.title)}" loading="lazy"></div><div class="card-info"><div><div class="card-title">${esc(w.title)}</div><div class="card-tags">${tags||'<span class="mini-tag">태그 없음</span>'}</div></div><button class="edit" type="button">태그 수정</button></div>`;const thumb=card.querySelector('.thumb');thumb.onclick=()=>showImage(w);thumb.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showImage(w)}};card.querySelector('.edit').onclick=()=>openEditor(w);grid.appendChild(card)});if(!list.length)grid.innerHTML='<div class="empty">이 태그가 설정된 작품이 없습니다.</div>';pagination.innerHTML='';if(pages>1){for(let i=1;i<=pages;i++){const b=document.createElement('button');b.className='page-btn'+(page===i?' active':'');b.textContent=i;b.onclick=()=>{page=i;render();document.getElementById('works').scrollIntoView({behavior:'smooth'})};pagination.appendChild(b)}}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){const obj={};works.forEach(w=>obj[w.id]=w.tags);localStorage.setItem(key,JSON.stringify(obj))}
function openEditor(w){editing=w;document.getElementById('dialogTitle').textContent=w.title;document.getElementById('tagInput').value=w.tags.join(', ');document.getElementById('tagDialog').classList.add('open');document.getElementById('tagInput').focus()}
document.getElementById('cancelTag').onclick=()=>document.getElementById('tagDialog').classList.remove('open');document.getElementById('saveTag').onclick=()=>{if(!editing)return;editing.tags=[...new Set(document.getElementById('tagInput').value.split(',').map(x=>x.trim()).filter(Boolean))];persist();document.getElementById('tagDialog').classList.remove('open');activeTag='전체';render()};document.getElementById('tagDialog').onclick=e=>{if(e.target.id==='tagDialog')e.currentTarget.classList.remove('open')};document.getElementById('tagInput').onkeydown=e=>{if(e.key==='Enter')document.getElementById('saveTag').click();if(e.key==='Escape')document.getElementById('cancelTag').click()};
function showImage(w){const m=document.getElementById('modal');m.querySelector('img').src=w.src;m.querySelector('img').alt=w.title;m.querySelector('.modal-caption').textContent=w.title;m.classList.add('open')}const modal=document.getElementById('modal');modal.querySelector('.close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){modal.classList.remove('open');document.getElementById('tagDialog').classList.remove('open')}});
document.getElementById('exportBtn').onclick=()=>{const data={version:1,works:Object.fromEntries(works.map(w=>[w.name,w.tags]))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='portfolio-tags.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const mapping=data.works||data;works.forEach(w=>{if(Array.isArray(mapping[w.name]))w.tags=mapping[w.name]});persist();activeTag='전체';render()}catch{alert('태그 JSON 파일을 읽지 못했습니다. 내보낸 JSON을 선택해 주세요.')}e.target.value=''};
render();
</script></body></html>
